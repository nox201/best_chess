	<style>
		
	#background {
		--s: 61px; /* control the size*/
		/* Grey */
		--c1: #b2b2b2;
		--c2: #ffffff;
		--c3: #d9d9d9;
		
		/*Blues*/
		/*--c1: #7BA9D4;
		--c2: #B7D4ED;
		--c3: #DFECF7;*/
	  
		--_g: var(--c3) 0 120deg,#0000 0;
		background:
			conic-gradient(from -60deg at 50% calc(100%/3),var(--_g)),
			conic-gradient(from 120deg at 50% calc(200%/3),var(--_g)),
			conic-gradient(from  60deg at calc(200%/3),var(--c3) 60deg,var(--c2) 0 120deg,#0000 0),
			conic-gradient(from 180deg at calc(100%/3),var(--c1) 60deg,var(--_g)),
			linear-gradient(90deg,var(--c1) calc(100%/6),var(--c2) 0 50%, var(--c1) 0 calc(500%/6),var(--c2) 0);
		background-size: calc(1.732*var(--s)) var(--s);
	}
	
	#board {
		border: 1px solid black;
	}
	#boardContainer {
		height: 0px;
		width: 40%;
		padding-bottom: 40%;
		display: inline-block;
	}
	
	.main {
		/*text-align: center;*/
	}
	
	.dataContainer {
		display: inline-block;
		background-color: white;
		vertical-align: top;
		text-align: left;
		/*padding: 20px;*/
		border-radius: 5px;
	}
	
	.sideContainer {
		width: 29%;
		display: inline-block;
		vertical-align: top;
		text-align: center;
	}
	
	.takenPool {
		width: 100%;
		text-align: center;
	}
	
	#whiteCheckDisplay {
		margin-top: 10px;
		width: 25%;
		height: 5%;
		margin-right: auto;
		margin-left: auto;
		background-color: #FFFFFF;
		border: 2px solid black;
	}
	#whiteCheckContent {
		font-size: 70px;
	}
	#blackCheckDisplay {
		margin-top: 10px;
		width: 25%;
		height: 5%;
		margin-right: auto;
		margin-left: auto;
		background-color: #FFFFFF;
		border: 2px solid black;
	}
	#blackCheckContent {
		font-size: 70px;
	}
	#whiteTakenPool {
		display: inline-block;
		width: 100%;
		height: 400px;
		text-align: center;
	}
	#blackTakenPool {
		display: inline-block;
		width: 100%;
		height: 400px;
		text-align: center;
	}
	#whiteTakenString {
		font-size: 20px;
	}
	#blackTakenString {
		font-size: 20px;
	}
	#whiteTurnDisplay {
		margin-top: 75px;
		width: 40%;
		text-align: center;
		padding: 20px;
	}
	#blackTurnDisplay {
		margin-top: 75px;
		width: 40%;
		text-align: center;
		padding: 20px;
	}
	
	#gameOver {
		position: absolute;
		left: 25%;
		top: 20%;
		height: 50%;
		width: 50%;
		border: 2px solid black;
		background-color: #FFFFFF;
		text-align: center;
		display: none;
	}
	
	.inverted {
		background-color: black;
		color: white;
	}
	
	</style>
</head>

	<div class="main">

<script>

	bgColours.push(['#B2B2B2','#B9B9B9','#C0C0C0','#C7C7C7','#CECECE','#D5D5D5','#DCDCDC','#E3E3E3','#EAEAEA','#F1F1F1','#F8F8F8','#FFFFFF','#FCFCFC','#F8F8F8','#F5F5F5','#F1F1F1','#EEEEEE','#EAEAEA','#E7E7E7','#E3E3E3','#E0E0E0','#DCDCDC','#D9D9D9','#D5D5D5','#D2D2D2','#CECECE','#CBCBCB','#C7C7C7','#C4C4C4','#C0C0C0','#BDBDBD','#B9B9B9','#B6B6B6']);
	bgColours.push(['#FFFFFF','#FCFCFC','#F8F8F8','#F5F5F5','#F1F1F1','#EEEEEE','#EAEAEA','#E7E7E7','#E3E3E3','#E0E0E0','#DCDCDC','#D9D9D9','#D5D5D5','#D2D2D2','#CECECE','#CBCBCB','#C7C7C7','#C4C4C4','#C0C0C0','#BDBDBD','#B9B9B9','#B6B6B6','#B2B2B2','#B9B9B9','#C0C0C0','#C7C7C7','#CECECE','#D5D5D5','#DCDCDC','#E3E3E3','#EAEAEA','#F1F1F1','#F8F8F8']);
	bgColours.push(['#D5D5D5','#D2D2D2','#CECECE','#CBCBCB','#C7C7C7','#C4C4C4','#C0C0C0','#BDBDBD','#B9B9B9','#B6B6B6','#B2B2B2','#B9B9B9','#C0C0C0','#C7C7C7','#CECECE','#D5D5D5','#DCDCDC','#E3E3E3','#EAEAEA','#F1F1F1','#F8F8F8','#FFFFFF','#FCFCFC','#F8F8F8','#F5F5F5','#F1F1F1','#EEEEEE','#EAEAEA','#E7E7E7','#E3E3E3','#E0E0E0','#DCDCDC','#D9D9D9']);
	bgColoursCounter = 0;
	
	//INITALIZE VARIABLES
	var boardContainer = document.getElementById('boardContainer');
	var canvas = document.getElementById('board');
	var plane = canvas.getContext('2d');
	var selectedRow;
	var selectedColumn;
	var currentTurn;
	var defendingCheck = false;
	var preventMove = false;
	var gameOver = false;
	
			
	function viewBoard()
	{
		document.getElementById('gameOver').style.display = 'none';
	}
	
	//ON LOAD
	window.addEventListener('load', (event) => {
	
		//CHANGE BACKGROUND COLOUR OVER TIME
		//hate this currently - need a better way of defining what colours to cycle through
		//although it also needs to run pretty fast to not look jarring, so maybe not worth it
		/*setInterval(function (){
			let background = document.getElementById('background');
			background.style.setProperty('--c1', bgColours[0][bgColoursCounter]);
			background.style.setProperty('--c2', bgColours[1][bgColoursCounter]);
			background.style.setProperty('--c3', bgColours[2][bgColoursCounter]);
			bgColoursCounter++;
			if(bgColoursCounter > 23){
				bgColoursCounter = 0;
			}
		}, 100);*/
	
		//SET CANVAS SIZE TO PARENT DIV - ALLOWS DYNAMIC RESIZING OF THE CANVAS, WHILE FORCING IT TO BE SQUARE
		canvas.width = parseInt(getComputedStyle(boardContainer).getPropertyValue('width'), 10);
		canvas.height = canvas.width;
		//SET SQUARE DIMENSIONS
		var squareSize = Math.floor(canvas.width / 8);
		//SET FONT - USED FOR HAVING UNICODE CHESS PIECES AS TEXT
		//Not sure if this is just a nice coincidence that the 'right' font size is nearly exactly the same as squaresize or thats how px values work
		var fontSize = squareSize - 5;
		document.getElementById('whiteTakenString').style.fontSize = fontSize - 5 + 'px';
		document.getElementById('blackTakenString').style.fontSize = fontSize - 5 + 'px';
		document.getElementById('whiteTakenPool').style.height = canvas.width / 2 + 'px';
		document.getElementById('blackTakenPool').style.height = canvas.width / 2 + 'px';
		//SET PLANE FONT
		plane.font = fontSize + 'px Tahoma';
		this.plane.textAlign = 'center';
		this.plane.textBaseline = 'bottom';
		
		//BIND HIGHEST LEVEL EVENT LISTENER
		canvas.addEventListener('click', handleCanvasClicked);
		
		//BIND 'SEE LAST MOVE ON HOVER' TO BOTH TURN DISPLAYS
		document.getElementById('whiteTurnDisplay').addEventListener('mouseover', showLastMove);
		document.getElementById('whiteTurnDisplay').addEventListener('mouseout', hideLastMove);
		
		//SET WHITE TO GO FIRST
		//I call swapTurn when starting the game, this is set to black so that white goes first
		currentTurn = 'black';
		
		//CREATE BOARD
		var board = new Board(null);
		
		//CREATE RENDERER
		var renderer = new Renderer(canvas);
		//DRAW BOARD
		renderer.draw(board);
		
		//HANDLE CLICK
		function handleCanvasClicked(event)
		{
			//DETERMINE WHICH SQUARE HAS BEEN CLICKED
			let x = Math.floor(event.offsetX / squareSize);
			let y = Math.floor(event.offsetY / squareSize);
			//BIND CLICK HANDLER TO BOARD
			postClickActions = board.handleClick(event, x, y);
			
			//CHECK FOR POST CLICK ACTIONS
			if(postClickActions.piece != false){
				updateTakenPool(postClickActions.piece);
			}
			if(postClickActions.inCheck){
				//CREATE ALERT NOTIFYING PLAYER THEY ARE MOVING INTO CHECK
				createAlert('moveIntoCheck');
				let checkMove = board.getCheckMove();
				board.addWarning(checkMove.moves[0].x, checkMove.moves[0].y);
				board.addWarning(checkMove.piece.piece.x, checkMove.piece.piece.y);
				//UNDO MOVE THAT PUT THE KING IN CHECK
				if(postClickActions.undo){
					board.undo();
				}
				//FINISH HERE, DONT SWAP TURN ETC
				return;
			}
			if(postClickActions.swapTurn){
				swapTurn();
			}
			
			//CHECK FOR CHECK
			if(board.isInCheck(currentTurn)){
				//CHECKMATE CHECK
				if(board.isInCheckmate(currentTurn)){
					createAlert('checkmate');
				}
				//DISPLAY CHECK WARNING TO PLAYER
				updateCheckWarning(currentTurn);
				//ADD WARNING COLOURS TO BOARD - ATTACKING PIECE AND KING POSITION
				let checkMove = board.getCheckMove();
				board.addWarning(checkMove.moves[0].x, checkMove.moves[0].y);
				board.addWarning(checkMove.piece.piece.x, checkMove.piece.piece.y);
			}else{
				//REMOVE ANY PREVIOUS CHECK BEHAVIOUR
				board.emptyWarning();
				updateCheckWarning(null);
			}
			
			if(postClickActions.undo){
				board.undo();
			}
			
			//REDRAW BOARD
			renderer.draw(board);
		}
		
		//----------------------
		//DISPLAY FUNCTIONS
		//----------------------
		
		//TAKEN POOL
		function updateTakenPool(piece)
		{
			//PIECE VARIABLE HERE IS THE TAKEN PIECE, SO NEED THE OPPOSITE PLAYERS TAKEN POOL
			if(piece.getColour() == 'black'){
				//SHOW PIECES UNICODE CHARACTER IN TAKEN POOL - SPACE IS REQUIRED AT THE END OTHERWISE THE STRING NEVER BREAKS ONTO A NEW LINE
				document.getElementById('whiteTakenString').innerHTML = document.getElementById('whiteTakenString').innerHTML + piece.getUnicode() + ' ';
			}else{
				document.getElementById('blackTakenString').innerHTML = document.getElementById('blackTakenString').innerHTML + piece.getUnicode() + ' ';
			}
		}
		
		//CHECK WARNING
		function updateCheckWarning(currentTurn)
		{
			switch(currentTurn){
				case 'white':					
					document.getElementById('whiteCheckDisplay').style.backgroundColor = 'pink';
					document.getElementById('blackCheckDisplay').style.backgroundColor = 'white';
				break;
				case 'black':
					document.getElementById('whiteCheckDisplay').style.backgroundColor = 'white';
					document.getElementById('blackCheckDisplay').style.backgroundColor = 'pink';
				break;
				default:
					document.getElementById('whiteCheckDisplay').style.backgroundColor = 'white';
					document.getElementById('blackCheckDisplay').style.backgroundColor = 'white';
				break;
			}
		}
		
		//CREATE ALERT
		function createAlert(alertType)
		{
			switch(alertType){
				case 'moveIntoCheck':
					let checkingPiece = board.getCheckingPiece();
					let flashing = true;
					let flashCounter = 0;
					var flashInterval = setInterval( function() {
						if(flashing){
							board.addWarning(checkingPiece.x, checkingPiece.y);
							flashing = false;
						}else{
							board.emptyWarning();
							flashing = true;
						}
						//INCREMENT TIMER
						flashCounter++;
						renderer.draw(board);
						
						if(flashCounter > 11){
							clearInterval(flashInterval);
						}
					}, 150);
				break;
				case 'checkmate':
					document.getElementById('gameOver').style.display = 'block';
					if(currentTurn == 'white'){
						document.getElementById('gameOverContent').innerHTML = 'Black Wins';
					}else{
						document.getElementById('gameOverContent').innerHTML = 'White Wins';
					}
				break;
			}
		}

		//SWAP PLAYERS TURN
		function swapTurn()
		{
			if(currentTurn == 'white'){
				currentTurn = 'black';
				document.getElementById('whiteTurnString').style.color = 'white';
				document.getElementById('blackTurnString').style.color = 'white';
				document.getElementById('whiteTurnDisplay').style.border = '5px solid white';
				document.getElementById('blackTurnDisplay').style.border = '5px solid green';
			}else{
				currentTurn = 'white';
				document.getElementById('whiteTurnString').style.color = 'black';
				document.getElementById('blackTurnString').style.color = 'black';
				document.getElementById('whiteTurnDisplay').style.border = '5px solid green';
				document.getElementById('blackTurnDisplay').style.border = '5px solid black';
			}
		}
		
		function showLastMove()
		{
			board.showLastMove = true;
			renderer.draw(board);
		}
		function hideLastMove()
		{
			board.showLastMove = false;
			renderer.draw(board);
		}
		
		function getRandomInt(max) {
			return Math.floor(Math.random() * max);
		}
		
		//----------------------
		//AI STUFF
		//----------------------
		
		document.getElementById('testMove').addEventListener('click', function() {
			//CALL FUNCTION
			makeAiMove();
		});
		
		function makeAiMove()
		{
			console.clear();
			console.log('Start of new AI move - ' + currentTurn + 's turn');
			
			//CREATE A COPY OF THE CURRENT BOARD
			let emulatedBoard = new Board(board.getStateCopy());
			
			//ALL VALID MOVES
			let allValidMoves = emulatedBoard.getAllValidMoves(currentTurn);
			
			let potentialMoves = [];
			let chosenMove = null;
			let currentBestMoveScore = board.getScore();
			let moveScore = board.getScore();
			let takenPiece = null;
			
			
			//EASY DIFFICULTY - WILL MOVE RANDOMLY APART FROM ALWAYS TAKING A PIECE IF POSSIBLE
			/*for(let i = 0; i < allValidMoves.length; i++){
				for(let j = 0; j < allValidMoves[i].moves.length; j++){
					//GET BOARD SCORE FOR MOVE
					moveScore = emulatedBoard.getScoreForMove(allValidMoves[i], allValidMoves[i].moves[j]);
					
					console.log(currentTurn + ' turn: ' + moveScore + ' score for moving ' + allValidMoves[i].piece.getName() + ' ' + allValidMoves[i].piece.getX() + ',' + allValidMoves[i].piece.getY() + ' to ' + allValidMoves[i].moves[j].x + ',' + allValidMoves[i].moves[j].y);
					
					//DETERMINE WHICH SCORE TO MAXIMISE - WHITE WANTS HIGHEST, BLACK WANTS LOWEST
					if(currentTurn == 'white'){
						//CHECK IF MOVE IS BETTER THAN PREVIOUSLY FOUND
						if(moveScore > currentBestMoveScore){
							//UPDATE BEST MOVE SCORE
							currentBestMoveScore = moveScore;
							//EMPTY ALL PREVIOUS POTENTIAL MOVES AND ADD NEW ONE
							potentialMoves = [];
							potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
						}else{
							if(moveScore == currentBestMoveScore){
								//MOVE TIES CURRENT BEST MOVE SCORE, ADD TO POTENTIAL MOVES
								potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
							}
						}
					}else{
						if(moveScore < currentBestMoveScore){
							//UPDATE BEST MOVE SCORE
							currentBestMoveScore = moveScore;
							//EMPTY ALL PREVIOUS POTENTIAL MOVES AND ADD NEW ONE
							potentialMoves = [];
							potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
						}else{
							if(moveScore == currentBestMoveScore){
								potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
							}
						}
					}
					//console.log('Chosen Move with a score of ' + currentBestMoveScore + ': ' + emulatedBoard.getScoreForMove(allValidMoves[i], allValidMoves[i].moves[j]));
				}
			}*/
			
			//MEDIUM DIFFICULTY - LOOKS ONE MOVE AHEAD
			//Ok so this now operates where it always takes a piece, even if it will mean losing a more valuable piece the move after. 
			//I think at the moment it sees a good score if the opponent were to NOT take the piece, even though other moves will show that is possible, and therefore chooses the move when it shouldn't?
			
			let secondAllValidMoves = [];
			let iterations = 0;
			let currentIterationBestScore = 0;
			let currentIterationBestMoves = [];
			//SET ARBITRARYILY HIGH DEFAULT VALUES
			if(currentTurn == 'white'){
				var bestScore = -9999;
			}else{
				var bestScore = 9999;
			}
			
			//ITERATE ALL CURRENT PLAYERS MOVES
			for(let i = 0; i < allValidMoves.length; i++){
				for(let j = 0; j < allValidMoves[i].moves.length; j++){
				
					takenPiece = null;
				
					//EMULATE MOVE
					//REMOVE PIECE FROM CURRENT SQUARE
					emulatedBoard.set(allValidMoves[i].piece.getX(), allValidMoves[i].piece.getY(), null);

									bestScore = moveScore;
								}else if(moveScore == bestScore){
									potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
								}
							}
							
							
						}
					}
					
					//UNDO MOVE
					emulatedBoard.set(allValidMoves[i].piece.getX(), allValidMoves[i].piece.getY(), allValidMoves[i].piece);
					if(takenPiece == null){
						emulatedBoard.set(allValidMoves[i].moves[j].x, allValidMoves[i].moves[j].y, null);
					}else{
						emulatedBoard.set(allValidMoves[i].moves[j].x, allValidMoves[i].moves[j].y, takenPiece);
					}
					
				}
