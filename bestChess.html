		--s: 61px; /* control the size*/
		--c1: #b2b2b2;
		--c2: #ffffff;
		--c3: #d9d9d9;
	  
		--_g: var(--c3) 0 120deg,#0000 0;
		background:
			conic-gradient(from -60deg at 50% calc(100%/3),var(--_g)),
			conic-gradient(from 120deg at 50% calc(200%/3),var(--_g)),
			conic-gradient(from  60deg at calc(200%/3),var(--c3) 60deg,var(--c2) 0 120deg,#0000 0),
			conic-gradient(from 180deg at calc(100%/3),var(--c1) 60deg,var(--_g)),

	#board {
		border: 1px solid black;
	}
	#boardContainer {
		height: 0px;
		width: 40%;
		padding-bottom: 40%;
		display: inline-block;
	}
	
	.main {
		text-align: center;
	}
	
	.dataContainer {
		display: inline-block;
		background-color: white;
		vertical-align: top;
		text-align: left;
		padding: 20px;
		border-radius: 5px;
	}
	
	.takenPool {

	}
	
	.turnDisplay {
		margin-top: 200px;
	}
	#whiteCheckDisplay {
		display: none;
	}
	#blackCheckDisplay {
		display: none;
	}
	#whiteTakenPool {
		width: 30px;
	}
	#blackTakenPool {
		width: 30px;
	}
	
	.inverted {
		background-color: black;
		color: white;
	}

		function updateTakenPool(piece)
		{
			
			//PIECE VARIABLE HERE IS THE TAKEN PIECE, SO NEED THE OPPOSITE PLAYERS TAKEN POOL
			if(piece.colour == 'black'){
				//SHOW PIECES UNICODE CHARACTER IN TAKEN POOL
				document.getElementById('whiteTakenPool').insertAdjacentHTML('beforeend', '<p style="margin: 0px; font-size: ' + Math.floor(fontSize / 2) + 'px">' + piece.getUnicode() + '</p>');
			}else{
				document.getElementById('blackTakenPool').insertAdjacentHTML('beforeend', '<p style="margin: 0px; font-size: ' + Math.floor(fontSize / 2) + 'px">' + piece.getUnicode() + '</p>');
			}
		}
		
		function swapTurn()
		{
			if(currentTurn == 'white'){
				currentTurn = 'black';
				document.getElementById('whiteTurnDisplay').style.color = 'white';
				document.getElementById('blackTurnDisplay').style.color = 'white';
			}else{
				currentTurn = 'white';
				document.getElementById('whiteTurnDisplay').style.color = 'black';
				document.getElementById('blackTurnDisplay').style.color = 'black';
			}
		}
		
		function makeMove()

			//INIT SCOPED VARIABLES
			let boardState = getBoardState();

			let allValidMoves = [];
			let selectedSquare = null;
			let selectedMove = null;
			
			//ITERATE THE BOARD STATE
			boardState.forEach((piece) => {
				//ONLY COMPUTE THE MOVE FOR THE CURRENT PLAYER
				if(piece.colour == player){
					//ONLY STORE VALID MOVES THAT CAN BE MADE (getValidMoves can return an empty array)
					if(piece.piece.getValidMoves(boardState).length > 0){
						allValidMoves.push({'piece': piece, 'moves': piece.piece.getValidMoves(boardState)});
					}
				}
			});
			
			//console.log(allValidMoves);
			//for(let i = 0; i < allValidMoves.length; i++){

				//}
			//}
			
			//LOG ALL VALID MOVES
			//console.log('allValidMoves[0].moves[0].row: ' + allValidMoves[0].moves[0].row + ', allValidMoves[0].moves[0].column: ' + allValidMoves[0].moves[0].column + ', piece: ' + allValidMoves[0].piece);
			
			//---------
			//AI
			//---------
			
			//GET CURRENT BOARD SCORE
			currentBoardScore = getBoardScore(boardState);
			console.log('Current Board Score: ' + currentBoardScore);
			emulatedBoard = getBoard(boardState);
			
			//-----------------------------------------------------***************
			//issue I have here is that my board state is not consistent
			//sometimes its an array containing 32 objects, one for each piece
			//sometimes its a 8x8 multi-dimensional array, arranged like the chessboard grid
			
			//possible 'easy' fix is to make getBoard return the same 32 object array format, same as getBoardState

			for(i = 0; i < allValidMoves.length; i++){
				//GET PIECE
				selectedPiece = allValidMoves[i].piece;
				for(j = 0; j < allValidMoves[i].moves.length; j++){

					//GET MOVE
					selectedMove = allValidMoves[i].moves[j];
					//EMULATE MOVE
					emulatedBoard[selectedMove.row][selectedMove.column].addPiece(selectedPiece);
					emulatedBoard[selectedPiece.row][selectedPiece.column].contains = null;
					
					score = getBoardScore(emulatedBoard);
					console.log(score);
				}
			}
			
			//PICK RANDOM PIECE TO MOVE
			randomPieceIndex = Math.floor(Math.random() * allValidMoves.length);
			//PICK RANDOM MOVE FOR THAT RANDOM PIECE
			randomMoveIndex = Math.floor(Math.random() * allValidMoves[randomPieceIndex].moves.length);
			
			//SET UTILITY VARIABLES - KEEPS THE LINES SHORTER :D
			selectedSquare = squares[allValidMoves[randomPieceIndex].piece.row][allValidMoves[randomPieceIndex].piece.column];
			//this is the random move, but can be replaced with something like chosenMove, created earlier
			//switch(difficulty) - will swap between random and how many moves ahead the algorithm checks
			selectedMove = allValidMoves[randomPieceIndex].moves[randomMoveIndex];
			
			//LOG AI MOVE
			console.log('AI move: ' + selectedSquare.getPiece().colour + ' ' + selectedSquare.getPiece().getName() + ' at row ' + selectedSquare.getPiece().row + ', column ' + selectedSquare.getPiece().column + ' moves to row ' + selectedMove.row + ', column ' + selectedMove.column);
			
			//ADD PIECE TO SQUARES BY GETTING PIECE FROM THE SQUARES - DONT PASS THE PIECE OBJECT AROUND
			if(squares[selectedMove.row][selectedMove.column].getPiece() != null){
				//UPDATE TAKEN POOL
				updateTakenPool(squares[selectedMove.row][selectedMove.column].getPiece());
			}
			squares[selectedMove.row][selectedMove.column].addPiece(selectedSquare.getPiece());
			//REMOVE PIECE FROM OLD LOCATION
			selectedSquare.contains = null;
			
			//SWAP PLAYER
			swapTurn();
			//REDRAW
			drawBoard();
		}

		function isCheckMated(boardState, squares)
		{
			let checkMated = true;
			let existingPiece = null;
			//ITERATE THE BOARD STATE
			boardState.forEach((occupiedSquare) => {
				//ONLY COMPUTE THE MOVE FOR THE CURRENT PLAYER
				if(occupiedSquare.colour == currentTurn){
					//ONLY STORE VALID MOVES THAT CAN BE MADE (getValidMoves can return an empty array)
					if(occupiedSquare.piece.getValidMoves(boardState).length > 0){
						occupiedSquare.piece.getValidMoves(boardState).forEach((move) => {
							//EMULATE MOVE
							if(squares[move.row][move.column].getPiece() != null){
								existingPiece = squares[move.row][move.column].getPiece();
							}else{
								existingPiece = null;
							}
							squares[move.row][move.column].addPiece(occupiedSquare.piece);
							squares[occupiedSquare.row][occupiedSquare.column].contains = null;
							
							//MOVE EMULATED, NOW CHECK IF THE KING IS STILL IN CHECK
							squares.forEach((row) => {
								row.forEach((column) => {
									if(column.getPiece() != null){
										//ONLY COMPUTE FOR THE CURRENT PLAYERS KING
										if(column.getPiece().getName() === 'King' && column.getPiece().colour === currentTurn){
											//console.log(occupiedSquare.piece.colour + ' ' + occupiedSquare.piece.getName() + ' moved to ' + move.row + ', ' + move.column);
											//console.log(getBoardState());
											//console.log('isChecked is ' + column.getPiece().isChecked(getBoardState()));
											//CHECK CHECK (ha ha ha)
											if(!column.getPiece().isChecked(getBoardState())){
												//console.log('MOVE REMOVES KING FROM CHECK MATE');
												//console.log(occupiedSquare.piece.getName() + ' moved to ' + move.row + ', ' + move.column);
												//appears that every move is counting as removing the king from check.
												checkMated = false;
											}
										}
									}
								})
							});
							
							//RESET MOVE
							if(existingPiece){
								squares[move.row][move.column].contains = existingPiece;
							}else{
								squares[move.row][move.column].contains = null;
							}
							squares[occupiedSquare.row][occupiedSquare.column].addPiece(occupiedSquare.piece);
							
						});
					}
				}
			});
			if(checkMated){
				//GAME OVER STATE?
				//console.log('king is check mated?');
			}	
			return checkMated;
		}
