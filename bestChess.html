<!DOCTYPE html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<head>

	<title>Bishops Castle</title>
	<script src="State.js"></script>
	<script src="Renderer.js"></script>
	<script src="Board.js"></script>
	<script src="Square.js"></script>
	<script src="Piece.js"></script>
	<script src="Pawn.js"></script>
	<script src="Castle.js"></script>
	<script src="Knight.js"></script>
	<script src="Bishop.js"></script>
	<script src="Queen.js"></script>
	<script src="King.js"></script>
	
	<style>
		
	.background {
		--s: 61px; /* control the size*/
		--c1: #b2b2b2;
		--c2: #ffffff;
		--c3: #d9d9d9;
	  
		--_g: var(--c3) 0 120deg,#0000 0;
		background:
			conic-gradient(from -60deg at 50% calc(100%/3),var(--_g)),
			conic-gradient(from 120deg at 50% calc(200%/3),var(--_g)),
			conic-gradient(from  60deg at calc(200%/3),var(--c3) 60deg,var(--c2) 0 120deg,#0000 0),
			conic-gradient(from 180deg at calc(100%/3),var(--c1) 60deg,var(--_g)),
			linear-gradient(90deg,var(--c1) calc(100%/6),var(--c2) 0 50%, var(--c1) 0 calc(500%/6),var(--c2) 0);
		background-size: calc(1.732*var(--s)) var(--s);
	}
	
	#board {
		border: 1px solid black;
	}
	#boardContainer {
		height: 0px;
		width: 40%;
		padding-bottom: 40%;
		display: inline-block;
	}
	
	.main {
		text-align: center;
	}
	
	.dataContainer {
		display: inline-block;
		background-color: white;
		vertical-align: top;
		text-align: left;
		padding: 20px;
		border-radius: 5px;
	}
	
	.takenPool {
		width: 100%;
		text-align: center;
	}
	
	.turnDisplay {
		margin-top: 200px;
	}
	#whiteCheckDisplay {
		display: none;
	}
	#blackCheckDisplay {
		display: none;
	}
	#whiteTakenPool {
		width: 30px;
	}
	#blackTakenPool {
		width: 30px;
	}
	
	.inverted {
		background-color: black;
		color: white;
	}
	
	</style>
</head>
<body class="background">

	<div class="main">
	
		<button id="testMove">Make Move</button>

		<div class="dataContainer turnDisplay">
			<span id="whiteTurnDisplay">White's Move</span>
			<span id="whiteCheckDisplay">You are in Check</span>
		</div>
		
		<div id="whiteTakenPool" class="dataContainer">
			<!--<span>White has taken: </span>-->
		</div>
		
		<div id="boardContainer">
			<canvas id="board" width="100%" height="100%"></canvas>
		</div>
		
		<div id="blackTakenPool"  class="dataContainer inverted">
			<!--<span>Black has taken: </span>-->
		</div>
		
		<div class="dataContainer turnDisplay inverted">
			<span id="blackTurnDisplay">Black's Move</span>
			<span id="blackCheckDisplay">You are in Check</span>
		</div>
		
	</div>

</body>

<script>

	//TO-DO
	//controls - rebuild the ability to click on pieces following rebuild of the Board/Square/Pieces - do I even use Square anymore?
	//ai - https://www.freecodecamp.org/news/simple-chess-ai-step-by-step-1d55a9266977/
	//ai - position evaluation
	//ai - search tree
	//ai - alpha-beta
	//ai - improved evaluation function
	//game controls - start new game, game win/lost state - including pawns firstMove logic, check and checkmate states
	//css - style, title, alerts, maybe see if i can make the background colours change over time
	//actual pieces - either images or proper drawings
	
	
	//INITALIZE VARIABLES
	var boardContainer = document.getElementById('boardContainer');
	var canvas = document.getElementById('board');
	var plane = canvas.getContext('2d');
	var selectedRow;
	var selectedColumn;
	var currentTurn;
	var defendingCheck = false;
	var preventMove = false;
	var gameOver = false;
	
	//ON LOAD
	window.addEventListener('load', (event) => {
	
		//SET CANVAS SIZE TO PARENT DIV - ALLOWS DYNAMIC RESIZING OF THE CANVAS, WHILE FORCING IT TO BE SQUARE
		canvas.width = parseInt(getComputedStyle(boardContainer).getPropertyValue('width'), 10);
		canvas.height = canvas.width;
		//SET SQUARE DIMENSIONS
		var squareSize = Math.floor(canvas.width / 8);
		//SET FONT - USED FOR HAVING UNICODE CHESS PIECES AS TEXT
		//Not sure if this is just a nice coincidence that the 'right' font size is nearly exactly the same as squaresize or thats how px values work
		var fontSize = squareSize - 5;
		//SET PLANE FONT
		plane.font = fontSize + 'px Tahoma';
		this.plane.textAlign = 'center';
		this.plane.textBaseline = 'bottom';
		
		//BIND HIGHEST LEVEL EVENT LISTENER
		canvas.addEventListener('click', handleCanvasClicked);
		
		//SET WHITE TO GO FIRST
		//I call swapTurn when starting the game, this is set to black so that white goes first
		currentTurn = 'black';
		
		//CREATE BOARD
		var board = new Board(null);
		
		//CREATE RENDERER
		var renderer = new Renderer(canvas);
		//DRAW BOARD
		renderer.draw(board);
		
		//HANDLE CLICK
		function handleCanvasClicked(event)
		{
			//DETERMINE WHICH SQUARE HAS BEEN CLICKED
			let x = Math.floor(event.offsetX / squareSize);
			let y = Math.floor(event.offsetY / squareSize);
			//BIND CLICK HANDLER TO BOARD
			postClickActions = board.handleClick(event, x, y);
			//REDRAW BOARD
			renderer.draw(board);
			//CHECK FOR POST CLICK ACTIONS
			if(postClickActions.piece != false){
				updateTakenPool(postClickActions.piece);
			}
			if(postClickActions.swapTurn != false){
				swapTurn();
			}
		}
		
		function updateTakenPool(piece)
		{
			//PIECE VARIABLE HERE IS THE TAKEN PIECE, SO NEED THE OPPOSITE PLAYERS TAKEN POOL
			if(piece.getColour() == 'black'){
				//SHOW PIECES UNICODE CHARACTER IN TAKEN POOL
				document.getElementById('whiteTakenPool').insertAdjacentHTML('beforeend', '<p style="margin: 0px; font-size: ' + Math.floor(fontSize / 2) + 'px">' + piece.getUnicode() + '</p>');
			}else{
				document.getElementById('blackTakenPool').insertAdjacentHTML('beforeend', '<p style="margin: 0px; font-size: ' + Math.floor(fontSize / 2) + 'px">' + piece.getUnicode() + '</p>');
			}
		}
		
		function swapTurn()
		{
			if(currentTurn == 'white'){
				currentTurn = 'black';
				document.getElementById('whiteTurnDisplay').style.color = 'white';
				document.getElementById('blackTurnDisplay').style.color = 'white';
			}else{
				currentTurn = 'white';
				document.getElementById('whiteTurnDisplay').style.color = 'black';
				document.getElementById('blackTurnDisplay').style.color = 'black';
			}
		}
		
		function getRandomInt(max) {
			return Math.floor(Math.random() * max);
		}

		//SWAP TURN WHEN STARTING GAME
		swapTurn();
		
		//----------------------
		//AI STUFF
		//----------------------
		
		document.getElementById('testMove').addEventListener('click', function() {
			//CALL FUNCTION
			makeAiMove();
		});
		
		function makeAiMove()
		{
			console.clear();
			console.log('Start of new AI move - ' + currentTurn + 's turn');
			
			//CREATE A COPY OF THE CURRENT BOARD
			let emulatedBoard = new Board(board.getStateCopy());
			
			//ALL VALID MOVES
			let allValidMoves = emulatedBoard.getAllValidMoves(currentTurn);
			
			let potentialMoves = [];
			let chosenMove = null;
			let currentBestMoveScore = board.getScore();
			let moveScore = board.getScore();
			let takenPiece = null;
			
			
			//EASY DIFFICULTY - WILL MOVE RANDOMLY APART FROM ALWAYS TAKING A PIECE IF POSSIBLE
			/*for(let i = 0; i < allValidMoves.length; i++){
				for(let j = 0; j < allValidMoves[i].moves.length; j++){
					//GET BOARD SCORE FOR MOVE
					moveScore = emulatedBoard.getScoreForMove(allValidMoves[i], allValidMoves[i].moves[j]);
					
					console.log(currentTurn + ' turn: ' + moveScore + ' score for moving ' + allValidMoves[i].piece.getName() + ' ' + allValidMoves[i].piece.getX() + ',' + allValidMoves[i].piece.getY() + ' to ' + allValidMoves[i].moves[j].x + ',' + allValidMoves[i].moves[j].y);
					
					//DETERMINE WHICH SCORE TO MAXIMISE - WHITE WANTS HIGHEST, BLACK WANTS LOWEST
					if(currentTurn == 'white'){
						//CHECK IF MOVE IS BETTER THAN PREVIOUSLY FOUND
						if(moveScore > currentBestMoveScore){
							//UPDATE BEST MOVE SCORE
							currentBestMoveScore = moveScore;
							//EMPTY ALL PREVIOUS POTENTIAL MOVES AND ADD NEW ONE
							potentialMoves = [];
							potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
						}else{
							if(moveScore == currentBestMoveScore){
								//MOVE TIES CURRENT BEST MOVE SCORE, ADD TO POTENTIAL MOVES
								potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
							}
						}
					}else{
						if(moveScore < currentBestMoveScore){
							//UPDATE BEST MOVE SCORE
							currentBestMoveScore = moveScore;
							//EMPTY ALL PREVIOUS POTENTIAL MOVES AND ADD NEW ONE
							potentialMoves = [];
							potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
						}else{
							if(moveScore == currentBestMoveScore){
								potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
							}
						}
					}
					//console.log('Chosen Move with a score of ' + currentBestMoveScore + ': ' + emulatedBoard.getScoreForMove(allValidMoves[i], allValidMoves[i].moves[j]));
				}
			}*/
			
			//MEDIUM DIFFICULTY - LOOKS ONE MOVE AHEAD
			//Ok so this now operates where it always takes a piece, even if it will mean losing a more valuable piece the move after. 
			//I think at the moment it sees a good score if the opponent were to NOT take the piece, even though other moves will show that is possible, and therefore chooses the move when it shouldn't?
			
			let secondAllValidMoves = [];
			let iterations = 0;
			let currentIterationBestScore = 0;
			let currentIterationBestMoves = [];
			//SET ARBITRARYILY HIGH DEFAULT VALUES
			if(currentTurn == 'white'){
				var bestScore = -9999;
			}else{
				var bestScore = 9999;
			}
			
			//ITERATE ALL CURRENT PLAYERS MOVES
			for(let i = 0; i < allValidMoves.length; i++){
				for(let j = 0; j < allValidMoves[i].moves.length; j++){
				
					takenPiece = null;
				
					//EMULATE MOVE
					//REMOVE PIECE FROM CURRENT SQUARE
					emulatedBoard.set(allValidMoves[i].piece.getX(), allValidMoves[i].piece.getY(), null);
					//CHECK FOR TAKING PIECE
					if(emulatedBoard.get(allValidMoves[i].moves[j].x, allValidMoves[i].moves[j].y) != null){
						//STORE TAKEN PIECE
						takenPiece = emulatedBoard.get(allValidMoves[i].moves[j].x, allValidMoves[i].moves[j].y);
					}
					//PLACE PIECE IN NEW SQUARE
					emulatedBoard.set(allValidMoves[i].moves[j].x, allValidMoves[i].moves[j].y, allValidMoves[i].piece);
					
					//console.log('NEW INITIAL MOVE');
					//EMULATE A SECOND COPY OF THE BOARD TO PERFORM THE OPPONENTS MOVES ON
					let secondEmulatedBoard = new Board(emulatedBoard.getStateCopy());
					//GET THE OPPONENTS VALID MOVES
					if(currentTurn == 'white'){
						secondAllValidMoves = emulatedBoard.getAllValidMoves('black');
					}else{
						secondAllValidMoves = emulatedBoard.getAllValidMoves('white');
					}
					
					//ITERATE OPPONENTS VALID MOVES
					for(let k = 0; k < secondAllValidMoves.length; k++){
						for(let l = 0; l < secondAllValidMoves[k].moves.length; l++){
						
							//GET BOARD SCORE FOR OPPONENTS MOVE
							moveScore = secondEmulatedBoard.getScoreForMove(secondAllValidMoves[k], secondAllValidMoves[k].moves[l]);
							
							//WHITE
							if(currentTurn == 'white'){
								//CHECK IF SCORE AFTER OPPONENTS MOVE BEATS CURRENT HIGHEST
								if(moveScore > bestScore){
									//console.log('NEW BEST SCORE FOUND FOR WHITE');
									//EMPTY THE EXISTING POTENTIAL MOVES
									potentialMoves = [{'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]}];
									//SET NEW HIGHEST SCORE
									bestScore = moveScore;
								}else if(moveScore == bestScore){
									//BOARD SCORE MATCHES EXISTING HIGHEST - ADD AS POTENTIAL MOVE
									potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
								}
							}else{
								//BLACK
								if(moveScore < bestScore){
									//console.log('NEW BEST SCORE FOUND FOR BLACK');
									potentialMoves = [{'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]}];
									bestScore = moveScore;
								}else if(moveScore == bestScore){
									potentialMoves.push({'piece': allValidMoves[i].piece, 'move': allValidMoves[i].moves[j]});
								}
							}
							
							
						}
					}
					
					//UNDO MOVE
					emulatedBoard.set(allValidMoves[i].piece.getX(), allValidMoves[i].piece.getY(), allValidMoves[i].piece);
					if(takenPiece == null){
						emulatedBoard.set(allValidMoves[i].moves[j].x, allValidMoves[i].moves[j].y, null);
					}else{
						emulatedBoard.set(allValidMoves[i].moves[j].x, allValidMoves[i].moves[j].y, takenPiece);
					}
					
				}
			}
			
			//console.log('Iterations: ' + iterations);
			//console.log('POTENTIAL MOVES LENGTH: ' + potentialMoves.length);
			//console.log(potentialMoves);
			
			//CHECK HOW MANY POTENTIAL MOVES (MOVES THAT HAVE THE SAME SCORE)
			if(potentialMoves.length > 1){
				//PICK A RANDOM POTENTIAL MOVE
				chosenMove = potentialMoves[getRandomInt(potentialMoves.length)];
			}else{
				chosenMove = potentialMoves[0];
			}
			
			//NOTE - ITS USEFUL THAT I CURRENTLY ERROR WHEN I DON'T HAVE A CHOSEN MOVE (IT SHOWS MY STUFF ISN'T WORKING RIGHT) BUT ONCE EVERYTHINGS WORKING PERFECTLY I COULD JUST DO A RANDOM VALIDMOVE IF CHOSEN MOVE IS EMPTY?
			console.log(currentTurn + ' Chosen Move score: ' + currentBestMoveScore + ' - moves ' + chosenMove.piece.name + ' from ' + chosenMove.piece.getX() + ',' + chosenMove.piece.getY() + ' to ' + chosenMove.move.x + ',' + chosenMove.move.y);
			
			//CHECK FOR TAKING PIECE
			if(board.get(chosenMove.move.x, chosenMove.move.y) != null){
				if(board.get(chosenMove.move.x, chosenMove.move.y).getColour() != currentTurn){
					//UPDATE TAKEN POOL
					updateTakenPool(board.get(chosenMove.move.x, chosenMove.move.y));
				}
			}

			//REMOVE PIECE FROM CURRENT SQUARE
			emulatedBoard.set(chosenMove.piece.getX(), chosenMove.piece.getY(), null);
			//PLACE PIECE IN NEW SQUARE
			emulatedBoard.set(chosenMove.move.x, chosenMove.move.y, chosenMove.piece);
			
			//PICK A RANDOM VALID MOVE
			//let randomValidMove = allValidMoves[getRandomInt(allValidMoves.length)];
			//let randomMove = randomValidMove.moves[getRandomInt(randomValidMove.moves.length)];
			
			//CHECK FOR TAKING PIECE
			//if(board.get(randomMove.x, randomMove.y) != null){
				//if(board.get(randomMove.x, randomMove.y).getColour() != currentTurn){
					//UPDATE TAKEN POOL
					//updateTakenPool(board.get(randomMove.x, randomMove.y));
				//}
			//}
			
			//REMOVE PIECE FROM CURRENT SQUARE
			//emulatedBoard.set(randomValidMove.piece.getX(), randomValidMove.piece.getY(), null);
			//PLACE PIECE IN NEW SQUARE
			//emulatedBoard.set(randomMove.x, randomMove.y, randomValidMove.piece);
			
			//POPULATE THE MAIN BOARD WITH MY NEW STATE
			board.populateBoard(emulatedBoard.getStateCopy());
			
			//CHECK FOR PAWN
			if(chosenMove.piece.getName() == 'Pawn'){
				//SET PAWN HAS MOVED
				board.get(chosenMove.move.x, chosenMove.move.y).hasMoved();
			}
			
			//REDRAW
			renderer.draw(board);
			
			//SWAP TURN
			swapTurn();
			
		}
		

	
	//close onload function
	}

</script>
